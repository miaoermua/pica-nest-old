name: Pica Configuration Validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'ci/**'
      - 'schema/**'
      - 'r/**'
      - 'worker/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pica-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python requirements
        run: python -m pip install jsonschema

      - name: Test change detection
        run: python3 .github/scripts/test_changed_packages.py

      - name: Test asset planning and fetching
        run: python3 .github/scripts/test_fetch_assets.py

      - name: Test version consistency
        run: python3 .github/scripts/test_check_versions.py

      - name: Test artifact verification
        run: python3 .github/scripts/test_artifacts.py

      - name: Test asset name sanitising
        run: python3 .github/scripts/test_sanitize_assets.py

      - name: Test the binary guard
        run: python3 .github/scripts/test_no_binaries.py

      - name: Test the index layout
        run: python3 .github/scripts/test_index_layout.py

      # The worker is the distributed copy of this repository's routing: it is
      # tested with a stubbed cache and upstream, so this needs no network and
      # no credentials. Node is preinstalled on the runner.
      - name: Test the Cloudflare Worker
        run: node --test worker/test_worker.mjs

      # Hard gate, not a warning: a package archive in the tree means a build
      # directory leaked into a commit, and rewriting history later is the only
      # way back. Covers tracked files and anything the commit would add.
      - name: Refuse build archives in Git
        run: python3 .github/scripts/check_no_binaries.py

      - name: Validate repository configuration
        run: python3 .github/scripts/validate_repo.py --check-pairs

      # The committed tree, not a generated one: this is what a client fetches
      # before any build runs, so drift between repo.json and the backend views
      # has to be caught here rather than after a publish.
      - name: Validate the published index layout
        run: python3 .github/scripts/validate_index_layout.py

      - name: Check manifest and source versions
        run: python3 .github/scripts/check_versions.py

      - name: Select the packages this change touches
        id: changed
        run: |
          set -euo pipefail
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            python3 .github/scripts/changed_packages.py \
              --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/changed_packages.py \
              --force-rebuild-all --github-output "$GITHUB_OUTPUT"
          fi

      - name: Plan the resources for those packages without the network
        env:
          SELECTED: ${{ steps.changed.outputs.packages }}
          FULL_VALIDATION: ${{ steps.changed.outputs.full_validation }}
        run: |
          set -euo pipefail
          PACKAGES="$SELECTED"
          if [ "$FULL_VALIDATION" = "true" ]; then
            # A shared input changed — the fetcher, the parser, the schema. Every
            # package's plan is derived from it, and none of them appear in the
            # diff, so planning only what changed would verify nothing at all.
            mapfile -t ALL < <(
              find src -mindepth 2 -maxdepth 2 -name manifest -printf '%h\n' | sort
            )
            PACKAGES="${ALL[*]}"
            echo "shared input changed: planning all ${#ALL[@]} packages"
          fi
          if [ -z "$PACKAGES" ]; then
            echo "No package changed; nothing to plan."
            exit 0
          fi
          python3 .github/scripts/fetch_assets.py --plan --offline \
            --stage-root "$RUNNER_TEMP/validate-stage" \
            --plan-output "$RUNNER_TEMP/validate-plan.json" \
            $PACKAGES

      - name: Summarize the offline plan
        if: always()
        run: |
          PLAN="$RUNNER_TEMP/validate-plan.json"
          if [ ! -f "$PLAN" ]; then
            echo "No package was planned (no package changed or selection skipped)."
            exit 0
          fi
          python3 .github/scripts/summarize_plan.py "$PLAN" || exit 1
