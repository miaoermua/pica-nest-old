name: Pica Package Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ci/**'
      - 'schema/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated src/<mgr>/<pkg> list; empty uses changed packages'
        required: false
        type: string
      force_rebuild_all:
        description: 'Rebuild every package'
        required: false
        type: boolean
        default: false
      arch:
        description: 'Optional target arch; must exist in every selected build.matrix'
        required: false
        type: string
      publish:
        description: 'Publish the validated artifacts (main branch only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pica-build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    # Pinned rather than `ubuntu-latest`: that label starts migrating to Ubuntu
    # 26 on 2026-10-19, and a package source should not have its build image
    # change underneath it mid-release. Move this once 26 has been exercised on
    # a branch and the artifacts compare equal.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      has_artifacts: ${{ steps.dist.outputs.has_artifacts }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect packages to build
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild_all }}
          MANUAL_PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$MANUAL_PACKAGES" ]; then
              python3 .github/scripts/changed_packages.py \
                --packages "$MANUAL_PACKAGES" --github-output "$GITHUB_OUTPUT"
            elif [ "$FORCE_REBUILD" = "true" ]; then
              python3 .github/scripts/changed_packages.py \
                --force-rebuild-all --github-output "$GITHUB_OUTPUT"
            else
              echo "error: manual runs must name packages or set force_rebuild_all" >&2
              exit 1
            fi
          else
            python3 .github/scripts/changed_packages.py \
              --base "$BEFORE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Checkout pica source
        id: pica
        uses: actions/checkout@v5
        with:
          repository: miaoermua/pica
          # The `apk` branch held the 0.3.33 packer while main was still on
          # 0.3.0. It has since been merged into main and deleted, so naming
          # it here made the checkout fail with "couldn't find remote ref".
          # main is 0.4.0: it writes a per-backend `index.json` instead of a
          # single `repo.json`, which the steps below account for.
          ref: main
          path: pica-source

      - name: Resolve pica commit
        id: pica_sha
        run: echo "sha=$(git -C pica-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache pica-pack for this pica commit
        id: pica_cache
        uses: actions/cache@v5
        with:
          path: pica-source/target/release/pica-pack
          key: pica-pack-${{ runner.os }}-${{ steps.pica_sha.outputs.sha }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build pica-pack
        if: steps.pica_cache.outputs.cache-hit != 'true'
        run: |
          cd pica-source
          cargo build --release --bin pica-pack

      - name: Install pica-pack
        run: sudo cp pica-source/target/release/pica-pack /usr/local/bin/pica-pack

      - name: Install Python requirements
        run: python -m pip install jsonschema

      - name: Plan resources without downloading
        if: steps.detect.outputs.packages != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE_ROOT: ${{ runner.temp }}/pica-stage
          PLAN_PATH: ${{ runner.temp }}/pica-plan.json
          PACKAGES: ${{ steps.detect.outputs.packages }}
          ARCH: ${{ github.event.inputs.arch }}
        run: |
          set -euo pipefail
          rm -rf "$STAGE_ROOT"
          ARGS=()
          if [ -n "$ARCH" ]; then
            ARGS+=(--arch "$ARCH")
          fi
          python3 .github/scripts/fetch_assets.py --plan --probe \
            --stage-root "$STAGE_ROOT" \
            --plan-output "$PLAN_PATH" \
            "${ARGS[@]}" $PACKAGES

      - name: Restore asset cache
        if: steps.detect.outputs.packages != ''
        uses: actions/cache@v5
        with:
          path: ~/.cache/pica-assets
          key: pica-assets-${{ runner.os }}-${{ hashFiles('ci/**/build.json', 'src/**/manifest') }}
          restore-keys: pica-assets-${{ runner.os }}-

      - name: Fetch the planned resources
        if: steps.detect.outputs.packages != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_PATH: ${{ runner.temp }}/pica-plan.json
        run: |
          python3 .github/scripts/fetch_assets.py --fetch-plan "$PLAN_PATH" \
            --cache-dir "$HOME/.cache/pica-assets"

      - name: Build Staged Packages
        if: steps.detect.outputs.packages != ''
        env:
          PLAN_PATH: ${{ runner.temp }}/pica-plan.json
        run: |
          set -euo pipefail
          mkdir -p build_output
          python3 -c 'import json,sys; [print(p["stage"]) for p in json.load(open(sys.argv[1]))["packages"]]' \
            "$PLAN_PATH" > "$RUNNER_TEMP/stages.txt"
          while IFS= read -r STAGE; do
            [ -n "$STAGE" ] || continue
            echo "Building package in $STAGE..."
            pica-pack build "$STAGE" --outdir build_output
          done < "$RUNNER_TEMP/stages.txt"

      - name: Generate and verify repository index
        id: index
        if: steps.detect.outputs.packages != ''
        env:
          # The rolling release is the only place artifacts are published to, so
          # every index entry can carry a stable absolute URL. Same value here and
          # in the publish job: the merge must be idempotent.
          DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/latest
        run: |
          set -euo pipefail
          if ! ls build_output/*/index.json > /dev/null 2>&1; then
            echo "error: no package was built" >&2
            exit 1
          fi

          # The artifact list lives in $RUNNER_TEMP, not under r/: nothing in a
          # Git-tracked directory may describe build output.
          python3 .github/scripts/gen_repo_index.py build_output/*/index.json \
            --download-base "$DOWNLOAD_BASE" \
            --release-list "$RUNNER_TEMP/release-files.txt"
          python3 .github/scripts/validate_repo.py --quiet
          # The layout is generated alongside the index; failing here means the
          # generator produced views that do not match what it just wrote.
          python3 .github/scripts/validate_index_layout.py --quiet

          ARTIFACT_DIRS=()
          for dir in build_output/*/; do
            ARTIFACT_DIRS+=(--artifacts-dir "$dir")
          done
          python3 .github/scripts/verify_artifacts.py \
            --index r/repo.json \
            --download-base "$DOWNLOAD_BASE" \
            "${ARTIFACT_DIRS[@]}" \
            --require-file "$RUNNER_TEMP/release-files.txt"

      - name: Prepare validated publish artifact
        id: dist
        if: steps.detect.outputs.packages != ''
        run: |
          set -euo pipefail
          mkdir -p dist/packages dist/build_output
          cp r/repo.json dist/repo.json
          : > dist/release-files.txt
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            if [ ! -f "$artifact" ]; then
              echo "error: release artifact is missing: $artifact" >&2
              exit 1
            fi
            name=$(basename "$artifact")
            cp "$artifact" "dist/packages/$name"
            # Upload paths are relative to the publish job's workspace, where
            # this same directory is restored as dist/.
            echo "dist/packages/$name" >> dist/release-files.txt
          done < "$RUNNER_TEMP/release-files.txt"
          for index in build_output/*/index.json; do
            backend=$(basename "$(dirname "$index")")
            mkdir -p "dist/build_output/$backend"
            cp "$index" "dist/build_output/$backend/index.json"
          done
          if [ -s dist/release-files.txt ]; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated publish artifact
        if: steps.dist.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pica-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      needs.build.outputs.has_artifacts == 'true' &&
      (github.event_name == 'push' ||
       (github.event.inputs.publish == 'true' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download validated artifact
        uses: actions/download-artifact@v6
        with:
          name: pica-dist
          path: dist

      - name: Merge into the current index and verify
        id: index
        env:
          DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/latest
        run: |
          set -euo pipefail
          # No artifacts are copied into a Git-tracked path. The index names the
          # Release asset; the release is where the bytes live.
          python3 .github/scripts/gen_repo_index.py dist/build_output/*/index.json \
            --download-base "$DOWNLOAD_BASE" \
            --artifacts-dir dist/packages
          python3 .github/scripts/validate_index_layout.py --quiet
          python3 .github/scripts/verify_artifacts.py \
            --index r/repo.json \
            --download-base "$DOWNLOAD_BASE" \
            --artifacts-dir dist/packages \
            --require-file dist/release-files.txt

          # Stage before deciding what changed. The layout adds files, and a
          # backend that lost its last package leaves a deletion — neither shows
          # up in `git diff` against a path that has to exist already. The
          # binary guard runs on what is staged, so this is also the point where
          # a stray archive would be caught rather than committed.
          git add -A -- r
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Index is unchanged; no release and no commit needed."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Expose release file list
        id: release_files
        if: steps.index.outputs.changed == 'true'
        run: |
          {
            echo 'files<<EOF'
            cat dist/release-files.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate Release Tag
        if: steps.index.outputs.changed == 'true'
        run: echo "RELEASE_TAG=$(date +'%y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

      # Assets are published before the index that points at them. If either
      # upload fails the job stops here and r/repo.json keeps its previous
      # content, so no client is ever handed a URL for a missing file.
      - name: Create Snapshot Release
        if: steps.index.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: ${{ steps.release_files.outputs.files }}

      # The rolling release is what download_url points at, so it has to hold
      # every version still named by the index — not only this run's files.
      # Assets from earlier runs are left in place.
      - name: Update Rolling Latest Release
        if: steps.index.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Packages
          files: ${{ steps.release_files.outputs.files }}

      # The bytes were just uploaded, so this is the first and only moment they
      # can be compared with the index: `--verify-published` downloads each file
      # this run built and checks its size and SHA-256, `--probe` HEADs the rest
      # so a historical entry that 404s or changed size is at least reported.
      #
      # A failure here stops before the commit: the release holds the new files
      # but no index points at them yet, and the previous index stays in place.
      # Recovery is a re-run of this same workflow — it re-uploads the same
      # filenames and commits an index built from what it just published. Nothing
      # here is repaired by hand.
      - name: Verify published assets match the index
        if: steps.index.outputs.changed == 'true'
        env:
          DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/latest
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_artifacts.py \
            --index r/repo.json \
            --download-base "$DOWNLOAD_BASE" \
            --artifacts-dir dist/packages \
            --require-file dist/release-files.txt \
            --verify-published --probe

      - name: Guard against binaries entering Git
        if: steps.index.outputs.changed == 'true'
        run: python3 .github/scripts/check_no_binaries.py

      - name: Commit index only
        if: steps.index.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- r
          if git diff --staged --quiet; then
            echo "No index change to commit."
            exit 0
          fi
          git commit -m "chore: update r/ index and backend views [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
